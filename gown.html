<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wedding dress | Burak Altaş Atelier</title>
  <meta name="description" content="Couture wedding dress, made to measure in İzmir and shipped worldwide.">
  <meta name="theme-color" content="#f7f2eb">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="preload" href="assets/fonts/jost-normal-300-500-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/bodoni-moda-normal-400-600-latin.woff2" as="font" type="font/woff2" crossorigin>

<body data-page="gown">
  <a class="skip" href="#main" data-i18n="skip">Skip to content</a>
  <header class="hdr" data-header></header>

  <main id="main">
    <div class="gown" id="gown"></div>

    <section class="section" aria-labelledby="tl-title">
      <div class="wrap">
        <div class="timeline-calc reveal">
          <div>
            <span class="eyebrow" data-i18n="tc.eyebrow">Do I have time?</span>
            <h2 class="h4 mt-s" id="tl-title" data-i18n="tc.title">Enter your wedding date — we'll draw your personal timeline.</h2>
          </div>
          <div data-timeline id="tl"></div>
        </div>
      </div>
    </section>

    <section class="section section--night" id="brides-sec" hidden aria-labelledby="brides-title">
      <div class="wrap">
        <h2 class="display h3" id="brides-title" style="margin-bottom:clamp(28px,4vw,48px)"></h2>
        <div class="reviews" id="gown-brides"></div>
      </div>
    </section>

    <section class="section section--tight section--paper" aria-labelledby="pair-title">
      <div class="wrap flex-between" style="margin-bottom:36px">
        <h2 class="display h3 reveal" id="pair-title"></h2>
        <div class="rail-nav">
          <button type="button" data-rail="rail-pair" data-dir="prev" aria-label="Previous" data-i18n-attr="aria-label:prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M21 12H3M9 6l-6 6 6 6"/></svg></button>
          <button type="button" data-rail="rail-pair" data-dir="next" aria-label="Next" data-i18n-attr="aria-label:next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M3 12h18M15 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="rail" id="rail-pair" tabindex="0" role="region" aria-labelledby="pair-title"></div>
    </section>

    <section class="section section--tight" aria-labelledby="more-title">
      <div class="wrap flex-between" style="margin-bottom:36px">
        <h2 class="display h3 reveal" id="more-title" data-i18n="moreColl">More from the collection</h2>
        <div class="rail-nav">
          <button type="button" data-rail="rail-more" data-dir="prev" aria-label="Previous" data-i18n-attr="aria-label:prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M21 12H3M9 6l-6 6 6 6"/></svg></button>
          <button type="button" data-rail="rail-more" data-dir="next" aria-label="Next" data-i18n-attr="aria-label:next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M3 12h18M15 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="rail" id="rail-more" tabindex="0" role="region" aria-labelledby="more-title"></div>
    </section>
  </main>

  <footer class="ftr" data-footer></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/built.js"></script>
  <script src="assets/js/fx.js"></script>
  <script src="assets/js/app.js"></script>

</html>
